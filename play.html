<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 그림책">
<meta name="theme-color" content="#bfe6ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>영어 그림책</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button id="back" aria-label="뒤로" style="visibility:hidden">◀</button>
  <h1 id="title">영어 그림책</h1>
  <span class="sp"></span>
</header>
<main id="app"></main>
<script src="courses/courses.js"></script>
<script>
  // ?c=<교재 id> 로 선택한 교재의 데이터와 그림 폴더를 불러옵니다.
  (function () {
    var id = new URLSearchParams(location.search).get("c");
    var c = COURSES.filter(function (x) { return x.id === id; })[0] || COURSES[0];
    window.COURSE = c; window.COURSE_ID = c.id; window.COURSE_BASE = "courses/" + c.id + "/";
    document.title = c.title;
    var daily = c.type === "daily";   // daily = 날짜별 문장 외우기 교재, 그 외 = 동화 교재
    (daily ? ["data.js", "audio.js"] : ["data.js", "story.js", "audio.js"]).forEach(function (f) { document.write('<script src="' + window.COURSE_BASE + f + '"><\/script>'); });
    document.write('<script src="js/sound.js"><\/script>');
    document.write('<script src="' + (daily ? "js/daily.js" : "js/app.js") + '"><\/script>');
  })();
</script>
</body>
</html>
