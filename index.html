<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 그림책">
<meta name="theme-color" content="#bfe6ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>영어 그림책</title>
<link rel="stylesheet" href="css/landing.css">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <span class="mascot" aria-hidden="true"><img id="mascot" src="courses/opposites-g1/img/mimi.png" alt="" onerror="this.replaceWith(document.createTextNode('🐰'))"></span>
    <div>
      <h1>영어 그림책</h1>
      <p>학교에서 배운 단어를 엄마와 아이의 이야기로 읽고 퀴즈로 익혀요.</p>
    </div>
  </header>

  <section aria-labelledby="pick">
    <h2 id="pick">교재를 골라요</h2>
    <div class="filters" id="filters" role="group" aria-label="학년 선택" hidden></div>
    <div class="courses" id="courses"></div>
  </section>

  <section class="howto" aria-labelledby="how">
    <h2 id="how">iPad · 휴대폰에서 앱처럼 쓰기</h2>
    <ol>
      <li>Safari로 이 주소를 엽니다.</li>
      <li>아래쪽 <b>공유</b> 버튼을 누르고 <b>홈 화면에 추가</b>를 고릅니다.</li>
      <li>홈 화면의 아이콘으로 열면 전체 화면으로 열리고, 한 번 본 그림은 인터넷이 없어도 나와요.</li>
    </ol>
    <p class="note">소리는 기기의 영어 음성으로 읽어 줍니다. 무음 모드가 켜져 있으면 소리가 나지 않을 수 있어요.</p>
  </section>
</main>
<script src="courses/courses.js"></script>
<script>
  (function () {
    function stars(c) {
      try {
        var s = JSON.parse(localStorage.getItem("oq:" + c.id) || "{}").stars || {}, n = 0;
        for (var i = 1; i <= c.books; i++) n += s["story" + i] || 0;
        return n;
      } catch (e) { return 0; }
    }
    var grades = [], seen = {};
    COURSES.forEach(function (c) { if (!seen[c.grade]) { seen[c.grade] = 1; grades.push(c.grade); } });
    var cur = "전체";
    function render() {
      var box = document.getElementById("courses");
      box.innerHTML = COURSES.filter(function (c) { return cur === "전체" || c.grade === cur; }).map(function (c) {
        var n = stars(c), max = c.books * 3;
        return '<a class="course" href="play.html?c=' + encodeURIComponent(c.id) + '" style="--c:' + c.color + '">' +
          '<span class="cover"><img src="' + c.cover + '" alt="" loading="lazy" onerror="this.remove()"></span>' +
          '<span class="body"><span class="tag">' + c.grade + ' · ' + c.subject + '</span>' +
          '<b>' + c.title + '</b><i>' + c.en + '</i><span class="desc">' + c.desc + '</span>' +
          '<span class="meta">동화 ' + c.books + '권 · 반대말 ' + c.pairs + '쌍</span>' +
          '<span class="prog" aria-label="별 ' + n + '/' + max + '"><span style="width:' + (n / max * 100) + '%"></span></span>' +
          '<span class="go">읽으러 가기 ▶</span></span></a>';
      }).join("");
    }
    if (grades.length > 1) {
      var f = document.getElementById("filters"); f.hidden = false;
      f.innerHTML = ["전체"].concat(grades).map(function (g) { return '<button type="button" data-g="' + g + '"' + (g === cur ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' + g + '</button>'; }).join("");
      f.addEventListener("click", function (e) {
        var g = e.target.getAttribute && e.target.getAttribute("data-g"); if (!g) return; cur = g;
        Array.prototype.forEach.call(f.children, function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-g") === g ? "true" : "false"); });
        render();
      });
    }
    render();
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
  })();
</script>
</body>
</html>
